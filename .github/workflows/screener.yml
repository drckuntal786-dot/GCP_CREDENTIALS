name: Run Stock Screener

on:
  schedule:
    - cron: '0 10 * * 1-5'  # Runs at 3:30 PM IST Mon-Fri
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repository files (CRITICAL)
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Decode GCP Credentials Secret
      - name: Authenticate Google Cloud
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          echo "$GCP_CREDENTIALS" > credentials.json

      # Step 4: Install Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 5: Run the Script
      - name: Run Screener
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python main.py
