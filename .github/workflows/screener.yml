name: Run Stock Screener

on:
  schedule:
    # 1. Pre-Market Scan: 9:08 AM IST (3:38 AM UTC) Mon-Fri
    - cron: '38 3 * * 1-5'
    # 2. Execution Run: 9:30 AM IST (4:00 AM UTC) Mon-Fri
    - cron: '0 4 * * 1-5'
    # 3. Nightly Reset / Preparation Run: 3:30 AM IST (10:00 PM UTC Sun-Thu)
    - cron: '0 22 * * 0-4'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance gspread google-auth

      - name: Setup Credentials
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          echo "$GCP_CREDENTIALS" > credentials.json

      - name: Run Screener
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python screener.py
