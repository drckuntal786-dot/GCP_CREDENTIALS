name: NSE F&O Short Screener Pipeline

on:
  schedule:
    # Runs at 10:00 AM UTC (3:30 PM IST) every Monday through Friday (Market Close)
    - cron: '0 10 * * 1-5'
  workflow_dispatch: # Allows manual triggers from GitHub Actions UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance gspread google-auth

      - name: Write GCP Service Account File
        run: |
          echo "${{ secrets.GCP_CREDENTIALS }}" > service_account.json
        # Fallback step ensuring service_account.json exists on runner disk

      - name: Execute Automated Pipeline
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python main.py
